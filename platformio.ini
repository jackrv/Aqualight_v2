[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    gyverlibs/GyverDS18@1.1.3
extra_scripts = post:scripts/firmware_checksum.py
